name: CI

on:
  pull_request:
    branches: [DEV, QA, UAT, PROD]
  push:
    branches: [DEV, QA, UAT, PROD]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: npm audit — production deps (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit — all deps (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  backend-quality-gates:
    name: Backend Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vin_portal_test
          POSTGRES_USER: vin_portal
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: vin_portal_test
          DATABASE_USER: vin_portal
          DATABASE_PASSWORD: testpass

      - name: Build
        run: npm run build

      - name: Run database migrations
        run: npm run migration:run
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: vin_portal_test
          DATABASE_USER: vin_portal
          DATABASE_PASSWORD: testpass

      - name: E2E tests
        run: npm run test:e2e
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: vin_portal_test
          DATABASE_USER: vin_portal
          DATABASE_PASSWORD: testpass

      - name: npm audit — production deps (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit — all deps (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build
        run: npm run build

      - name: Run E2E smoke tests
        run: npx playwright test --grep @smoke --project=chromium --project=mobile-chrome

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  # ──────────────────────────────────────────────
  # Checkmarx Enterprise Security Scans (REQUIRED)
  # ──────────────────────────────────────────────
  checkmarx:
    name: Checkmarx Security Scan
    runs-on: ubuntu-latest
    needs: quality-gates
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkmarx SAST + SCA Scan
        uses: checkmarx/ast-github-action@v2
        with:
          project_name: vin-portal
          cx_tenant: ${{ secrets.CHECKMARX_TENANT }}
          cx_client_id: ${{ secrets.CHECKMARX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CHECKMARX_CLIENT_SECRET }}
          additional_params: --scan-types sast,sca --threshold "sast-high=0;sast-medium=5;sca-high=0"

      - name: Check policy compliance
        if: failure()
        run: |
          echo "::error::Checkmarx policy violation detected. Fix security findings before merging."
          exit 1

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Lighthouse CI
        run: npm run lighthouse

  # ──────────────────────────────────────────────
  # Deployment Pipeline
  # ──────────────────────────────────────────────

  # ── DEV ──
  deploy-dev:
    name: Deploy Frontend to DEV
    runs-on: ubuntu-latest
    needs: [quality-gates, backend-quality-gates, e2e, checkmarx]
    if: github.ref == 'refs/heads/DEV' && github.event_name == 'push'
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Inject Datadog tokens
        run: |
          sed -i "s/REPLACE_WITH_DATADOG_CLIENT_TOKEN/${{ secrets.DD_CLIENT_TOKEN }}/g" src/environments/environment.prod.ts
          sed -i "s/REPLACE_WITH_DATADOG_APP_ID/${{ secrets.DD_APPLICATION_ID }}/g" src/environments/environment.prod.ts
          sed -i "s/env: 'prod'/env: '${{ vars.DD_ENV }}'/g" src/environments/environment.prod.ts

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload sourcemaps to Datadog
        run: |
          npx @datadog/datadog-ci sourcemaps upload dist/vin-portal/browser/ \
            --service vin-portal \
            --release-version ${{ github.sha }} \
            --minified-path-prefix /
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}

      - name: Remove sourcemaps from bundle
        run: find dist/ -name "*.map" -delete

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/vin-portal/browser/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/vin-portal/browser/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/index.html"

      # ── Post-deploy health check ──
      # Rollback criteria: 5xx > 5% for 5 min or RUM error rate > 10%
      - name: Health check deployed frontend
        id: health-check
        run: |
          DEPLOY_URL="${{ vars.DEPLOY_URL }}"
          MAX_RETRIES=5
          RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$DEPLOY_URL")
            echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Health check passed"
              exit 0
            fi
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            fi
          done
          echo "::error::Health check failed after $MAX_RETRIES attempts"
          exit 1

      # ── Frontend rollback: re-sync previous S3 artifacts from prior commit ──
      - name: Rollback frontend to previous version
        if: failure() && steps.health-check.outcome == 'failure'
        run: |
          echo "::warning::Rolling back frontend to previous commit's artifacts"
          PREV_SHA=$(git rev-parse HEAD~1)
          echo "Previous commit: $PREV_SHA"

          # Check out the previous commit's source to rebuild
          git checkout "$PREV_SHA" -- .

          # Reinstall and rebuild from the previous commit
          npm ci --legacy-peer-deps
          npm run build

          # Remove sourcemaps before deploying rollback
          find dist/ -name "*.map" -delete

          # Re-deploy the previous build to S3
          aws s3 sync dist/vin-portal/browser/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/vin-portal/browser/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

          # Invalidate CloudFront to serve rolled-back content
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          NODE_ENV: production

      - name: Notify Slack of frontend rollback
        if: failure() && steps.health-check.outcome == 'failure'
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"text\": \":rotating_light: *Frontend Rollback Triggered* (DEV)\nCommit: \`${{ github.sha }}\`\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nHealth check failed after 5 retries. Previous version restored.\"
              }"
          else
            echo "SLACK_WEBHOOK_URL not configured — skipping notification"
          fi

  deploy-backend-dev:
    name: Deploy Backend to DEV
    runs-on: ubuntu-latest
    needs: [quality-gates, backend-quality-gates, e2e, checkmarx]
    if: github.ref == 'refs/heads/DEV' && github.event_name == 'push'
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: backend
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }} --all-tags

      - name: Run database migrations
        working-directory: backend
        run: npm run migration:run
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }}
        timeout-minutes: 10

      # ── Post-deploy health check ──
      # Rollback criteria: 5xx > 5% for 5 min or RUM error rate > 10%
      - name: Health check deployed backend
        id: backend-health-check
        run: |
          API_URL="${{ vars.API_BASE_URL }}/health"
          MAX_RETRIES=5
          RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$API_URL")
            echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Health check passed"
              exit 0
            fi
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            fi
          done
          echo "::error::Backend health check failed after $MAX_RETRIES attempts"
          exit 1

      # ── Backend rollback: force ECS to redeploy the previous task revision ──
      - name: Rollback backend to previous ECS task revision
        if: failure() && steps.backend-health-check.outcome == 'failure'
        run: |
          echo "::warning::Rolling back backend ECS service to previous task revision"
          # Get the current task definition (the failed one)
          CURRENT_TD=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' --output text)
          echo "Current (failed) task definition: $CURRENT_TD"

          # Extract the revision number and compute the previous one
          CURRENT_REV=$(echo "$CURRENT_TD" | grep -o '[0-9]*$')
          PREV_REV=$((CURRENT_REV - 1))
          TD_FAMILY=$(echo "$CURRENT_TD" | sed "s/:${CURRENT_REV}$/:${PREV_REV}/")
          echo "Rolling back to task definition: $TD_FAMILY"

          # Update the service to use the previous task definition
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --task-definition "$TD_FAMILY" \
            --force-new-deployment

          # Wait for the rollback deployment to stabilize
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }}
        timeout-minutes: 10

      - name: Notify Slack of backend rollback
        if: failure() && steps.backend-health-check.outcome == 'failure'
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"text\": \":rotating_light: *Backend Rollback Triggered* (DEV)\nCommit: \`${{ github.sha }}\`\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nHealth check failed after 5 retries. Previous ECS task revision restored.\"
              }"
          else
            echo "SLACK_WEBHOOK_URL not configured — skipping notification"
          fi

  # ── QA ──
  deploy-qa:
    name: Deploy Frontend to QA
    runs-on: ubuntu-latest
    needs: [quality-gates, backend-quality-gates, e2e, checkmarx]
    if: github.ref == 'refs/heads/QA' && github.event_name == 'push'
    environment: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Inject Datadog tokens
        run: |
          sed -i "s/REPLACE_WITH_DATADOG_CLIENT_TOKEN/${{ secrets.DD_CLIENT_TOKEN }}/g" src/environments/environment.prod.ts
          sed -i "s/REPLACE_WITH_DATADOG_APP_ID/${{ secrets.DD_APPLICATION_ID }}/g" src/environments/environment.prod.ts
          sed -i "s/env: 'prod'/env: '${{ vars.DD_ENV }}'/g" src/environments/environment.prod.ts

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload sourcemaps to Datadog
        run: |
          npx @datadog/datadog-ci sourcemaps upload dist/vin-portal/browser/ \
            --service vin-portal \
            --release-version ${{ github.sha }} \
            --minified-path-prefix /
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}

      - name: Remove sourcemaps from bundle
        run: find dist/ -name "*.map" -delete

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/vin-portal/browser/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/vin-portal/browser/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/index.html"

      # ── Post-deploy health check ──
      # Rollback criteria: 5xx > 5% for 5 min or RUM error rate > 10%
      - name: Health check deployed frontend
        id: health-check
        run: |
          DEPLOY_URL="${{ vars.DEPLOY_URL }}"
          MAX_RETRIES=5
          RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$DEPLOY_URL")
            echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Health check passed"
              exit 0
            fi
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            fi
          done
          echo "::error::Health check failed after $MAX_RETRIES attempts"
          exit 1

      # ── Frontend rollback: re-sync previous S3 artifacts from prior commit ──
      - name: Rollback frontend to previous version
        if: failure() && steps.health-check.outcome == 'failure'
        run: |
          echo "::warning::Rolling back frontend to previous commit's artifacts"
          PREV_SHA=$(git rev-parse HEAD~1)
          echo "Previous commit: $PREV_SHA"

          # Check out the previous commit's source to rebuild
          git checkout "$PREV_SHA" -- .

          # Reinstall and rebuild from the previous commit
          npm ci --legacy-peer-deps
          npm run build

          # Remove sourcemaps before deploying rollback
          find dist/ -name "*.map" -delete

          # Re-deploy the previous build to S3
          aws s3 sync dist/vin-portal/browser/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --cache-control "max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/vin-portal/browser/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

          # Invalidate CloudFront to serve rolled-back content
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/*"
        env:
          NODE_ENV: production

      - name: Notify Slack of frontend rollback
        if: failure() && steps.health-check.outcome == 'failure'
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"text\": \":rotating_light: *Frontend Rollback Triggered* (QA)\nCommit: \`${{ github.sha }}\`\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nHealth check failed after 5 retries. Previous version restored.\"
              }"
          else
            echo "SLACK_WEBHOOK_URL not configured — skipping notification"
          fi

  deploy-backend-qa:
    name: Deploy Backend to QA
    runs-on: ubuntu-latest
    needs: [quality-gates, backend-quality-gates, e2e, checkmarx]
    if: github.ref == 'refs/heads/QA' && github.event_name == 'push'
    environment: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: backend
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }} --all-tags

      - name: Run database migrations
        working-directory: backend
        run: npm run migration:run
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }}
        timeout-minutes: 10

      # ── Post-deploy health check ──
      # Rollback criteria: 5xx > 5% for 5 min or RUM error rate > 10%
      - name: Health check deployed backend
        id: backend-health-check
        run: |
          API_URL="${{ vars.API_BASE_URL }}/health"
          MAX_RETRIES=5
          RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$API_URL")
            echo "Attempt $i/$MAX_RETRIES: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Health check passed"
              exit 0
            fi
            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            fi
          done
          echo "::error::Backend health check failed after $MAX_RETRIES attempts"
          exit 1

      # ── Backend rollback: force ECS to redeploy the previous task revision ──
      - name: Rollback backend to previous ECS task revision
        if: failure() && steps.backend-health-check.outcome == 'failure'
        run: |
          echo "::warning::Rolling back backend ECS service to previous task revision"
          # Get the current task definition (the failed one)
          CURRENT_TD=$(aws ecs describe-services \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' --output text)
          echo "Current (failed) task definition: $CURRENT_TD"

          # Extract the revision number and compute the previous one
          CURRENT_REV=$(echo "$CURRENT_TD" | grep -o '[0-9]*$')
          PREV_REV=$((CURRENT_REV - 1))
          TD_FAMILY=$(echo "$CURRENT_TD" | sed "s/:${CURRENT_REV}$/:${PREV_REV}/")
          echo "Rolling back to task definition: $TD_FAMILY"

          # Update the service to use the previous task definition
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE }} \
            --task-definition "$TD_FAMILY" \
            --force-new-deployment

          # Wait for the rollback deployment to stabilize
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE }}
        timeout-minutes: 10

      - name: Notify Slack of backend rollback
