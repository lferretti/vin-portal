          path: playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Post-Deploy Load Test Smoke (QA only)
  # ──────────────────────────────────────────────
  # Runs a lightweight k6 smoke profile (1 VU, 40s) after QA deploy
  # to verify API performance is within SLA thresholds.
  # Full load tests run on a nightly schedule via load-test.yml.

  load-test-smoke-qa:
    name: Load Test Smoke (QA)
    runs-on: ubuntu-latest
    needs: [smoke-qa]
    if: github.ref == 'refs/heads/QA' && github.event_name == 'push'
    environment: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Create results directory
        run: mkdir -p load-tests/results

      - name: Run auth-flow smoke
        run: |
          k6 run \
            -e BASE_URL=${{ vars.API_BASE_URL }} \
            --vus 1 --duration 40s \
            --summary-export=load-tests/results/auth-flow-smoke.json \
            load-tests/scenarios/auth-flow.js

      - name: Run vin-flow smoke
        run: |
          k6 run \
            -e BASE_URL=${{ vars.API_BASE_URL }} \
            --vus 1 --duration 40s \
            --summary-export=load-tests/results/vin-flow-smoke.json \
            load-tests/scenarios/vin-flow.js

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-results-qa-${{ github.run_number }}
          path: load-tests/results/
          retention-days: 14
