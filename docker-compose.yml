services:
  postgres:
    image: postgres:16-alpine
    container_name: vin-portal-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: vin_portal
      POSTGRES_USER: vin_portal
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vin_portal']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
