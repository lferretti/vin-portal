name: Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target API base URL'
        required: true
        default: 'https://api.staging.example.com'
        type: string
      environment:
        description: 'Environment name'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - qa
          - uat
      scenario:
        description: 'Scenario to run (or "all" for all scenarios)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - auth-flow
          - vin-flow
          - admin-search
      admin_token:
        description: 'Admin JWT token (required for admin-search scenario)'
        required: false
        type: string

concurrency:
  group: load-test-${{ github.event.inputs.environment }}
  cancel-in-progress: true

jobs:
  load-test:
    name: k6 Load Test (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Verify k6 installation
        run: k6 version

      - name: Run auth-flow scenario
        if: >-
          github.event.inputs.scenario == 'all' ||
          github.event.inputs.scenario == 'auth-flow'
        run: |
          k6 run \
            -e BASE_URL=${{ github.event.inputs.target_url }} \
            --out json=load-tests/results/auth-flow.json \
            --summary-export=load-tests/results/auth-flow-summary.json \
            load-tests/scenarios/auth-flow.js
        continue-on-error: true

      - name: Run vin-flow scenario
        if: >-
          github.event.inputs.scenario == 'all' ||
          github.event.inputs.scenario == 'vin-flow'
        run: |
          k6 run \
            -e BASE_URL=${{ github.event.inputs.target_url }} \
            --out json=load-tests/results/vin-flow.json \
            --summary-export=load-tests/results/vin-flow-summary.json \
            load-tests/scenarios/vin-flow.js
        continue-on-error: true

      - name: Run admin-search scenario
        if: >-
          (github.event.inputs.scenario == 'all' ||
          github.event.inputs.scenario == 'admin-search') &&
          github.event.inputs.admin_token != ''
        run: |
          k6 run \
            -e BASE_URL=${{ github.event.inputs.target_url }} \
            -e ADMIN_TOKEN=${{ github.event.inputs.admin_token }} \
            --out json=load-tests/results/admin-search.json \
            --summary-export=load-tests/results/admin-search-summary.json \
            load-tests/scenarios/admin-search.js
        continue-on-error: true

      - name: Create results directory if missing
        if: always()
        run: mkdir -p load-tests/results

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.event.inputs.environment }}-${{ github.run_number }}
          path: load-tests/results/
          retention-days: 30
