              $ref: '#/components/schemas/AdminRequestDetailData'
            error:
              nullable: true

    AdminNoteRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 4000

    AdminNoteResponseData:
      type: object
      required: [requestId, noteSaved]
      properties:
        requestId:
          type: string
          format: uuid
        noteSaved:
          type: boolean

    EnvelopeAdminNoteResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          required: [data, error]
          properties:
            data:
              $ref: '#/components/schemas/AdminNoteResponseData'
            error:
              nullable: true
